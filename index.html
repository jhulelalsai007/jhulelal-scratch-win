
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jhulelal Sai Scratch & Win</title>
<style>
body{margin:0;padding:20px;font-family:Arial,sans-serif;text-align:center;background:linear-gradient(#fff7ed,#fed7aa);color:#7c2d12}
h1{font-size:30px}
.card{max-width:360px;margin:20px auto;background:white;padding:18px;border-radius:20px;box-shadow:0 5px 20px #0002}
#game{position:relative;height:250px;max-width:320px;margin:auto;background:#fff7ed;border-radius:15px;overflow:hidden}
#prize{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#emoji{font-size:65px}
#message{font-size:22px;font-weight:bold}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
button{padding:13px 18px;margin:10px 3px;border:0;border-radius:12px;background:#ea580c;color:white;font-weight:bold;font-size:16px}
.small{font-size:12px;color:#666}
</style>
</head>
<body>
<h1>🙏 Jhulelal Sai 🙏</h1>
<h2>Scratch & Win 🛒</h2>
<p>Scratch karo aur apna result dekho!</p>

<div class="card">
  <div id="game">
    <div id="prize">
      <div id="emoji">🎁</div>
      <div id="message">Scratch Here!</div>
      <p id="detail">Jai Jhulelal Sai</p>
    </div>
    <canvas id="cover"></canvas>
  </div>
  <button onclick="newCard()">New Scratch Card</button>
  <p class="small">Demo only: result actual grocery prize ki guarantee nahi hai.</p>
</div>

<script>
const canvas=document.getElementById('cover');
const ctx=canvas.getContext('2d');
let scratching=false, revealed=false;

const prizes=[
 {emoji:'🍜',name:'MAGGI!',detail:'Demo prize — approval required',win:true},
 {emoji:'🍪',name:'BISCUITS!',detail:'Demo prize — approval required',win:true},
 {emoji:'🍫',name:'CHOCOLATE!',detail:'Demo prize — approval required',win:true},
 {emoji:'🥤',name:'COLD DRINK!',detail:'Demo prize — approval required',win:true},
 {emoji:'🙏',name:'Better Luck Next Time',detail:'Jai Jhulelal Sai!',win:false},
 {emoji:'🙏',name:'Better Luck Next Time',detail:'Jai Jhulelal Sai!',win:false},
 {emoji:'🙏',name:'Better Luck Next Time',detail:'Jai Jhulelal Sai!',win:false}
];
let current;

function setup(){
 const r=canvas.getBoundingClientRect();
 const d=window.devicePixelRatio||1;
 canvas.width=r.width*d;
 canvas.height=r.height*d;
 ctx.setTransform(d,0,0,d,0,0);
 ctx.globalCompositeOperation='source-over';
 const g=ctx.createLinearGradient(0,0,r.width,r.height);
 g.addColorStop(0,'#9ca3af');
 g.addColorStop(.5,'#f8fafc');
 g.addColorStop(1,'#64748b');
 ctx.fillStyle=g;
 ctx.fillRect(0,0,r.width,r.height);
 ctx.fillStyle='#334155';
 ctx.textAlign='center';
 ctx.font='bold 22px Arial';
 ctx.fillText('SCRATCH HERE',r.width/2,r.height/2);
 ctx.globalCompositeOperation='destination-out';
}

function newCard(){
 current=prizes[Math.floor(Math.random()*prizes.length)];
 document.getElementById('emoji').textContent='🎁';
 document.getElementById('message').textContent='Scratch Here!';
 document.getElementById('detail').textContent='Jai Jhulelal Sai';
 revealed=false;
 setup();
}

function reveal(){
 if(revealed)return;
 revealed=true;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 document.getElementById('emoji').textContent=current.emoji;
 document.getElementById('message').textContent=current.name;
 document.getElementById('detail').textContent=current.detail;
}

function scratch(e){
 if(revealed)return;
 const r=canvas.getBoundingClientRect();
 const x=e.clientX-r.left,y=e.clientY-r.top;
 ctx.beginPath();
 ctx.arc(x,y,22,0,Math.PI*2);
 ctx.fill();
 const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;
 let clear=0,total=0;
 for(let i=3;i<pixels.length;i+=64){
  total++;
  if(pixels[i]===0)clear++;
 }
 if(clear/total>.4)reveal();
}

canvas.addEventListener('pointerdown',e=>{
 scratching=true;
 canvas.setPointerCapture(e.pointerId);
 scratch(e);
});
canvas.addEventListener('pointermove',e=>{
 if(scratching)scratch(e);
});
canvas.addEventListener('pointerup',()=>scratching=false);
canvas.addEventListener('pointercancel',()=>scratching=false);
window.addEventListener('resize',setup);
newCard();
</script>
</body>
</html>
